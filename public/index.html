<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow-Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
  :root {
    --bg: #F3EFE7;
    --surface: #FFFFFF;
    --surface-2: #FBF8F2;
    --ink: #221E1A;
    --ink-muted: #78705F;
    --line: #E4DACB;
    --accent: #C8102E;
    --accent-ink: #FFFFFF;
    --accent-soft: #F9D9DD;
    --zone-good: #3F7D5C;
    --zone-watch: #B4842A;
    --zone-critical: #AA4636;
    --zone-good-bg: rgba(63,125,92,0.16);
    --zone-watch-bg: rgba(180,132,42,0.20);
    --zone-critical-bg: rgba(170,70,54,0.20);
    --shadow: 0 1px 2px rgba(34,30,26,0.06), 0 8px 24px rgba(34,30,26,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1815;
      --surface: #221E19;
      --surface-2: #2A251F;
      --ink: #F1EAE0;
      --ink-muted: #AEA290;
      --line: #3B342B;
      --accent: #FF5C72;
      --accent-ink: #241014;
      --accent-soft: #4A1B22;
      --zone-good: #6FBE93;
      --zone-watch: #E0B65C;
      --zone-critical: #E08670;
      --zone-good-bg: rgba(111,190,147,0.18);
      --zone-watch-bg: rgba(224,182,92,0.20);
      --zone-critical-bg: rgba(224,134,112,0.20);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1815;
    --surface: #221E19;
    --surface-2: #2A251F;
    --ink: #F1EAE0;
    --ink-muted: #AEA290;
    --line: #3B342B;
    --accent: #FF5C72;
    --accent-ink: #241014;
    --accent-soft: #4A1B22;
    --zone-good: #6FBE93;
    --zone-watch: #E0B65C;
    --zone-critical: #E08670;
    --zone-good-bg: rgba(111,190,147,0.18);
    --zone-watch-bg: rgba(224,182,92,0.20);
    --zone-critical-bg: rgba(224,134,112,0.20);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--accent);
  }
  .brand .sub {
    font-size: 0.78rem;
    color: var(--ink-muted);
    letter-spacing: 0.03em;
  }
  .counter-pill {
    font-family: "IBM Plex Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.82rem;
    font-weight: 700;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 90px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 36px;
  }
  @media (max-width: 560px) {
    .card { padding: 24px 18px; border-radius: 10px; }
    main { padding: 24px 12px 70px; }
  }

  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .lede {
    color: var(--ink-muted);
    font-size: 1.02rem;
    max-width: 52ch;
    margin: 14px 0 0;
  }

  .qr-block {
    display: flex;
    gap: 22px;
    align-items: center;
    margin: 28px 0;
    padding: 20px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    flex-wrap: wrap;
  }
  .qr-block img { width: 132px; height: 132px; border-radius: 6px; background: #fff; padding: 6px; flex: none; }
  .qr-block .url {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.85rem;
    word-break: break-all;
    color: var(--ink-muted);
  }

  .btn-row { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
  button, .btn {
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 24px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    display: inline-block;
  }
  button.secondary, .btn.secondary {
    background: transparent;
    color: var(--accent);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .rail {
    display: flex;
    gap: 6px;
    margin-bottom: 30px;
  }
  .rail .seg {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .rail .seg.done::after {
    content: "";
    position: absolute; inset: 0;
    background: var(--accent);
  }
  .rail .seg.current::after {
    content: "";
    position: absolute; inset: 0;
    background: var(--accent-soft);
  }

  .dim-heading {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 1.15rem;
    margin: 34px 0 4px;
    color: var(--ink);
  }
  .dim-heading:first-of-type { margin-top: 0; }
  .dim-sub { color: var(--ink-muted); font-size: 0.86rem; margin-bottom: 18px; }

  fieldset { border: none; margin: 0 0 18px; padding: 0; }
  .q-text { font-weight: 500; margin-bottom: 10px; line-height: 1.4; }

  .scale-caption {
    font-size: 0.78rem; color: var(--ink-muted); margin: -8px 0 20px;
  }
  .scale { display: flex; align-items: center; }
  .scale-options { display: flex; gap: 12px; }
  .scale-option {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-family: "IBM Plex Mono", monospace; font-size: 0.76rem; color: var(--ink-muted);
    cursor: pointer;
  }
  .scale-option input {
    width: 22px; height: 22px; accent-color: var(--accent); cursor: pointer; margin: 0;
  }
  .debug-btn {
    border: 1px dashed var(--ink-muted);
    background: transparent;
    color: var(--ink-muted);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
  .debug-btn:hover { color: var(--ink); border-color: var(--ink); }
  fieldset.missing .q-text { color: var(--zone-critical); }
  fieldset.missing .scale {
    outline: 2px solid var(--zone-critical);
    outline-offset: 8px;
    border-radius: 6px;
  }

  #error-msg {
    display: none;
    color: var(--zone-critical);
    font-weight: 600;
    margin-bottom: 18px;
    padding: 12px 14px;
    background: var(--zone-critical-bg);
    border-radius: 8px;
  }
  #error-msg.show { display: block; }

  .radar-wrap { display: flex; justify-content: center; margin: 6px 0 10px; }
  .axis-label {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    font-weight: 600;
    fill: var(--ink);
  }
  .ring-legend {
    display: flex; gap: 18px; justify-content: center; flex-wrap: wrap;
    font-size: 0.78rem; color: var(--ink-muted); margin: 4px 0 26px;
  }
  .ring-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

  table.results-table { width: 100%; border-collapse: collapse; margin-top: 18px; }
  table.results-table th, table.results-table td {
    text-align: left; padding: 11px 8px; border-bottom: 1px solid var(--line); font-size: 0.94rem;
  }
  table.results-table th { color: var(--ink-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
  table.results-table td.num { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; padding: 3px 11px; border-radius: 999px;
    font-size: 0.76rem; font-weight: 700;
  }
  .badge.good { background: var(--zone-good-bg); color: var(--zone-good); }
  .badge.watch { background: var(--zone-watch-bg); color: var(--zone-watch); }
  .badge.critical { background: var(--zone-critical-bg); color: var(--zone-critical); }

  .status-note { color: var(--ink-muted); font-size: 0.86rem; margin-top: 22px; }
  .thanks-icon { font-size: 2.2rem; margin-bottom: 6px; }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.35s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark">Flow-Radar</span><span class="sub">ATLAS Quick-Check</span></div>
  <span class="counter-pill" id="topbar-counter">0 Rückmeldungen</span>
</header>
<div id="app"></div>
<script>
(function () {
  "use strict";

  var DIMENSIONS = ["Leadership", "Alignment", "Steuerung", "Teams", "Architektur"];

  var DIM_INTRO = {
    Leadership: "Wie Entscheidungen getroffen und Teams geführt werden.",
    Alignment: "Wie klar Initiativen und Ziele im Unternehmen verbunden sind.",
    Steuerung: "Wie gut Arbeit und Abhängigkeiten über Teams hinweg gesteuert werden.",
    Teams: "Wie die Teams selbst arbeiten und sich verbessern.",
    Architektur: "Wie unabhängig Teams businessrelevante Funktionen liefern können."
  };

  var QUESTIONS = [
    { dim: "Leadership", text: "Entscheidungen haben den Kunden im Fokus." },
    { dim: "Leadership", text: "Wir übernehmen Verantwortung für Entscheidungen." },
    { dim: "Leadership", text: "Führung fokussiert Mitarbeiter und Teams." },

    { dim: "Alignment", text: "Allen ist klar, welche Initiativen in deinem Unternehmen im Fokus stehen." },
    { dim: "Alignment", text: "Deine Teams wissen genau, wie ihre Arbeit auf Initiativen einzahlt." },
    { dim: "Alignment", text: "Teams und Abteilungen unterstützen sich bei der Erreichung von Zielen." },

    { dim: "Steuerung", text: "Die anfallende Arbeit bekommen wir in der Regel gut abgearbeitet." },
    { dim: "Steuerung", text: "Der Arbeitsablauf wird wertschöpfungsübergreifend optimiert." },
    { dim: "Steuerung", text: "Abhängigkeiten sind bekannt und werden frühzeitig adressiert." },

    { dim: "Teams", text: "Eure Teams kennen die Kundenerwartungen." },
    { dim: "Teams", text: "Eure Teams reflektieren regelmäßig über teaminterne Verbesserungsmöglichkeiten." },
    { dim: "Teams", text: "Deine Teams gehen Probleme teamübergreifend an." },

    { dim: "Architektur", text: "Businessrelevante Funktionalitäten werden nach der Übergabe an ein anderes Team ohne Stocken sofort weiterentwickelt." },
    { dim: "Architektur", text: "Jedes Team kann unabhängig von anderen Teams businessrelevante Funktionen in die Produktion überführen." },
    { dim: "Architektur", text: "Unsere Teams liefern gemeinsam alle 1–2 Sprints businessrelevante Funktionen in die Produktion." }
  ].map(function (q, i) { q.id = "q" + i; return q; });

  // Set after deployment: a data-URI PNG of the QR code pointing at the real, final URL.
  var QR_DATA_URI = "";

  var POLL_MS = 3000;
  var pollTimer = null;
  var latestData = { submissions: [] };

  // ---------- backend ----------

  function api(url, opts) {
    return fetch(url, opts).then(function (r) {
      if (!r.ok) {
        return r.json().catch(function () { return {}; }).then(function (e) {
          var err = new Error(e.error || ("http_" + r.status));
          err.code = e.error || ("http_" + r.status);
          throw err;
        });
      }
      return r.json();
    });
  }

  function fetchData() { return api("/api/data"); }

  function submitAnswers(answers) {
    var id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
    return api("/api/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, answers: answers })
    });
  }

  function resetData() {
    return api("/api/reset", { method: "POST" });
  }

  function averagesFromSubmissions(submissions) {
    var sums = {}, counts = {};
    DIMENSIONS.forEach(function (d) { sums[d] = 0; counts[d] = 0; });
    submissions.forEach(function (s) {
      QUESTIONS.forEach(function (q) {
        var v = s.answers[q.id];
        if (typeof v === "number") { sums[q.dim] += v; counts[q.dim] += 1; }
      });
    });
    var avg = {};
    DIMENSIONS.forEach(function (d) { avg[d] = counts[d] ? sums[d] / counts[d] : 0; });
    return avg;
  }

  function zoneFor(avg) {
    if (avg < 2.33) return { label: "kritisch", cls: "critical" };
    if (avg < 3.67) return { label: "Handlungsbedarf", cls: "watch" };
    return { label: "gut aufgestellt", cls: "good" };
  }

  // ---------- radar svg ----------

  function radarSvg(averages) {
    var size = 560, cx = size / 2, cy = size / 2 + 4, maxR = 138, minR = 12;
    var n = DIMENSIONS.length;
    var angleFor = function (i) { return -Math.PI / 2 + i * (2 * Math.PI / n); };
    var pt = function (angle, r) { return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)]; };

    var rGreen = maxR, rYellow = maxR * 0.66, rRed = maxR * 0.33;

    var svg = '<svg viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Radar-Diagramm der fünf ATLAS-Dimensionen">';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rGreen + '" style="fill:var(--zone-good-bg)"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rYellow + '" style="fill:var(--zone-watch-bg)"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rRed + '" style="fill:var(--zone-critical-bg)"/>';

    for (var i = 0; i < n; i++) {
      var p = pt(angleFor(i), maxR);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" style="stroke:var(--line)" stroke-width="1.3"/>';
    }

    var points = DIMENSIONS.map(function (d, i) {
      var frac = Math.max(0, Math.min(1, (averages[d] - 1) / 4));
      var r = minR + frac * (maxR - minR);
      return pt(angleFor(i), r);
    });
    var polyStr = points.map(function (p) { return p.join(","); }).join(" ");
    svg += '<polygon points="' + polyStr + '" style="fill:var(--accent);stroke:var(--accent)" fill-opacity="0.28" stroke-width="2.5"/>';
    points.forEach(function (p) {
      svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4.5" style="fill:var(--accent)"/>';
    });

    DIMENSIONS.forEach(function (d, i) {
      var p = pt(angleFor(i), maxR + 28);
      var c = Math.cos(angleFor(i));
      var anchor = c > 0.35 ? "start" : (c < -0.35 ? "end" : "middle");
      svg += '<text x="' + p[0] + '" y="' + p[1] + '" text-anchor="' + anchor + '" class="axis-label">' + d + "</text>";
    });

    svg += "</svg>";
    return svg;
  }

  // ---------- views ----------

  function currentView() {
    var h = location.hash.replace("#", "");
    if (["survey", "ergebnisse", "danke"].indexOf(h) >= 0) return h;
    return "intro";
  }

  function renderIntro() {
    var qrHtml = QR_DATA_URI
      ? '<img src="' + QR_DATA_URI + '" alt="QR-Code zu diesem Check"><div class="url">' + location.origin + "</div>"
      : '<div class="url">Link: ' + location.href + "</div>";
    return '<div class="card">' +
      '<div class="eyebrow">ATLAS Quick-Check</div>' +
      "<h2>Wo steht ihr gerade im Flow zwischen euren Teams?</h2>" +
      '<p class="lede">15 Aussagen zu fünf Dimensionen — Leadership, Alignment, Steuerung, Teams, Architektur. Am Ende seht ihr das gemeinsame Bild als Radar.</p>' +
      '<div class="qr-block">' + qrHtml + "</div>" +
      '<div class="btn-row">' +
      '<button data-nav="survey">Jetzt mitmachen</button>' +
      '<a class="btn secondary" href="#ergebnisse">Gemeinsames Ergebnis ansehen</a>' +
      "</div>" +
      '<p class="status-note">' + latestData.submissions.length + " Rückmeldungen bisher.</p>" +
      "</div>";
  }

  function renderSurvey() {
    var byDim = {};
    DIMENSIONS.forEach(function (d) { byDim[d] = []; });
    QUESTIONS.forEach(function (q) { byDim[q.dim].push(q); });

    var rail = '<div class="rail">' + DIMENSIONS.map(function () {
      return '<div class="seg"></div>';
    }).join("") + "</div>";

    var body = "";
    DIMENSIONS.forEach(function (d) {
      body += '<div class="dim-heading">' + d + "</div>";
      body += '<div class="dim-sub">' + DIM_INTRO[d] + "</div>";
      byDim[d].forEach(function (q) {
        body += '<fieldset data-qid="' + q.id + '">' +
          '<div class="q-text">' + q.text + "</div>" +
          '<div class="scale"><div class="scale-options">' +
          [1, 2, 3, 4, 5].map(function (v) {
            return '<label class="scale-option"><input type="radio" name="' + q.id + '" value="' + v + '"><span>' + v + "</span></label>";
          }).join("") +
          "</div></div></fieldset>";
      });
    });

    return '<div class="card">' + rail +
      '<div class="scale-caption">1 = trifft nicht zu &middot; 5 = trifft voll zu</div>' +
      '<div class="btn-row">' +
      '<button type="button" id="fill-test-btn" class="debug-btn">Testdaten ausfüllen (Debug)</button>' +
      "</div>" +
      '<div id="error-msg">Bitte alle Aussagen beantworten — die markierten fehlen noch.</div>' +
      '<form id="survey-form">' + body + "</form>" +
      '<div class="btn-row">' +
      '<button id="submit-btn">Ergebnis speichern</button>' +
      '<a class="btn secondary" href="#">Abbrechen</a>' +
      "</div></div>";
  }

  function renderResults() {
    var averages = averagesFromSubmissions(latestData.submissions);
    var rows = DIMENSIONS.map(function (d) {
      var zone = zoneFor(averages[d]);
      return "<tr><td>" + d + '</td><td class="num">' + averages[d].toFixed(1) + " / 5</td>" +
        '<td><span class="badge ' + zone.cls + '">' + zone.label + "</span></td></tr>";
    }).join("");

    return '<div class="card">' +
      '<div class="eyebrow">Gemeinsames Ergebnis</div>' +
      "<h2>Flow-Radar</h2>" +
      '<p class="lede">' + latestData.submissions.length + " Rückmeldungen. Aktualisiert sich automatisch, sobald jemand mitmacht." + "</p>" +
      '<div class="radar-wrap">' + radarSvg(averages) + "</div>" +
      '<div class="ring-legend">' +
      '<span><span class="dot" style="background:var(--zone-good)"></span>gut aufgestellt (außen)</span>' +
      '<span><span class="dot" style="background:var(--zone-watch)"></span>Handlungsbedarf (Mitte)</span>' +
      '<span><span class="dot" style="background:var(--zone-critical)"></span>kritisch (innen)</span>' +
      "</div>" +
      '<table class="results-table"><tr><th>Dimension</th><th>Mittelwert</th><th>Einschätzung</th></tr>' + rows + "</table>" +
      '<div class="btn-row">' +
      '<a class="btn secondary" href="#">Selbst mitmachen</a>' +
      '<button type="button" id="clear-btn" class="debug-btn">Antworten löschen</button>' +
      "</div>" +
      "</div>";
  }

  function renderThanks() {
    return '<div class="card">' +
      '<div class="thanks-icon">✓</div>' +
      "<h2>Danke, gespeichert.</h2>" +
      '<p class="lede">Deine Antworten sind Teil des gemeinsamen Bilds.</p>' +
      '<div class="btn-row"><a class="btn" href="#ergebnisse">Gemeinsames Ergebnis ansehen</a></div>' +
      "</div>";
  }

  function renderSubmitError(err) {
    var app = document.getElementById("app");
    var reasonText = {
      invalid_payload: "Antwort konnte nicht gelesen werden.",
      invalid_answers: "Ein Wert war ungültig.",
      unauthorized: "Nicht berechtigt."
    }[err && err.code] || "Speichern hat nicht geklappt — bitte kurz prüfen, ob eine Internetverbindung besteht.";
    app.innerHTML = '<div class="card">' +
      "<h2>Nicht gespeichert</h2>" +
      '<p class="lede">' + reasonText + "</p>" +
      '<div class="btn-row"><a class="btn" href="#survey">Erneut versuchen</a></div>' +
      "</div>";
  }

  function render() {
    var app = document.getElementById("app");
    var view = currentView();
    if (view === "survey") app.innerHTML = renderSurvey();
    else if (view === "ergebnisse") app.innerHTML = renderResults();
    else if (view === "danke") app.innerHTML = renderThanks();
    else app.innerHTML = renderIntro();
    attachHandlers(view);
    updateTopbar();
    managePolling(view);
  }

  function managePolling(view) {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    if (view === "ergebnisse" || view === "intro") {
      pollTimer = setInterval(function () {
        fetchData().then(function (d) {
          var changed = JSON.stringify(d.submissions) !== JSON.stringify(latestData.submissions);
          latestData = d;
          if (!changed) return;
          updateTopbar();
          if (currentView() === "ergebnisse") {
            document.getElementById("app").innerHTML = renderResults();
            attachHandlers("ergebnisse");
          } else if (currentView() === "intro") {
            document.getElementById("app").innerHTML = renderIntro();
            attachHandlers("intro");
          }
        }).catch(function () {});
      }, POLL_MS);
    }
  }

  function updateTopbar() {
    var pill = document.getElementById("topbar-counter");
    if (pill) pill.textContent = latestData.submissions.length + " Rückmeldungen";
  }

  function attachHandlers(view) {
    var startBtn = document.querySelector('[data-nav="survey"]');
    if (startBtn) startBtn.addEventListener("click", function () { location.hash = "survey"; });

    if (view === "survey") {
      // DEBUG-ONLY: remove this block (and the button in renderSurvey) before real workshop use.
      var fillBtn = document.getElementById("fill-test-btn");
      if (fillBtn) {
        fillBtn.addEventListener("click", function () {
          QUESTIONS.forEach(function (q) {
            var v = 1 + Math.floor(Math.random() * 5);
            var input = document.querySelector('input[name="' + q.id + '"][value="' + v + '"]');
            if (input) input.checked = true;
          });
          document.getElementById("error-msg").classList.remove("show");
          document.querySelectorAll("fieldset.missing").forEach(function (fs) { fs.classList.remove("missing"); });
        });
      }

      var submitBtn = document.getElementById("submit-btn");
      submitBtn.addEventListener("click", function (ev) {
        ev.preventDefault();
        var missing = [];
        var answers = {};
        document.querySelectorAll("fieldset[data-qid]").forEach(function (fs) {
          fs.classList.remove("missing");
          var qid = fs.dataset.qid;
          var checked = document.querySelector('input[name="' + qid + '"]:checked');
          if (checked) answers[qid] = Number(checked.value);
          else missing.push(fs);
        });
        var errorEl = document.getElementById("error-msg");
        if (missing.length > 0) {
          errorEl.classList.add("show");
          missing.forEach(function (fs) { fs.classList.add("missing"); });
          missing[0].scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
        errorEl.classList.remove("show");
        submitBtn.disabled = true;
        submitBtn.textContent = "Wird gespeichert…";
        submitAnswers(answers).then(function () {
          return fetchData();
        }).then(function (d) {
          latestData = d;
          location.hash = "danke";
        }).catch(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Ergebnis speichern";
          renderSubmitError(err);
        });
      });
    }

    if (view === "ergebnisse") {
      var clearBtn = document.getElementById("clear-btn");
      if (clearBtn) {
        clearBtn.addEventListener("click", function () {
          if (!window.confirm("Wirklich alle Antworten löschen? Das kann nicht rückgängig gemacht werden.")) return;
          resetData().then(function () {
            return fetchData();
          }).then(function (d) {
            latestData = d;
            render();
          }).catch(function (err) {
            renderSubmitError(err);
          });
        });
      }
    }
  }

  window.addEventListener("hashchange", render);

  fetchData().then(function (d) {
    latestData = d;
    render();
  }).catch(function () {
    render();
  });
})();
</script>
</body>
</html>
